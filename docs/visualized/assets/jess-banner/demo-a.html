<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>案A 糸 — 極細トップバー</title>
<link rel="stylesheet" href="_mock.css">
<style>
  body { padding-top: 32px; }
  .jess-bar {
    position: fixed; inset: 0 0 auto 0; height: 32px; z-index: 9999;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: rgba(16, 17, 19, .82);
    -webkit-backdrop-filter: blur(12px) saturate(1.3); backdrop-filter: blur(12px) saturate(1.3);
    font-size: 11.5px; letter-spacing: .06em; color: rgba(255, 255, 255, .85);
  }
  .jess-bar .dot { width: 5px; height: 5px; border-radius: 50%; background: #e5a94d; }
  .jess-bar .label { font-weight: 600; }
  .jess-bar code {
    font-family: "SF Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0;
    color: rgba(255, 255, 255, .48);
  }
  .jess-bar a {
    position: absolute; right: 16px; color: rgba(255, 255, 255, .72);
    text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, .28); padding-bottom: 1px;
  }
  .jess-bar a:hover { color: #fff; border-bottom-color: rgba(255, 255, 255, .6); }
</style>
</head>
<body>
<div class="jess-bar" role="status">
  <span class="dot"></span>
  <span class="label">デモ表示中</span>
  <code>user:repeat · purchase:completed · cart:with_items</code>
  <a href="#">元の状態に戻る</a>
</div>
<main class="shop">
  <div class="shop-head">
    <h1>Sparrow Store</h1>
    <span class="user">こんにちは、佐藤 花子 さん（リピーター）</span>
  </div>
  <p class="shop-sub">ホストアプリのモック画面 — jess のバナーがこの上にどう載るかを確認する</p>
  <div class="grid">
    <div class="card"><div class="thumb"></div><h2>オーガニックコーヒー豆 200g</h2><p class="price">¥1,480</p><button>カートに入れる</button></div>
    <div class="card"><div class="thumb"></div><h2>セラミックドリッパー</h2><p class="price">¥2,860</p><button>カートに入れる</button></div>
    <div class="card"><div class="thumb"></div><h2>ハンドグラインダー</h2><p class="price">¥6,930</p><button>カートに入れる</button></div>
  </div>
  <div class="cartbar"><span>カート: 2点（¥4,340）</span><span>購入履歴: 3件</span></div>
</main>
</body>
</html>
