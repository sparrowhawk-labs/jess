<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>復帰ジャーニー — デモ状態（案C 気配バナー）</title>
<link rel="stylesheet" href="_mock.css">
<style>
  .jess-chip {
    position: fixed; top: 14px; right: 14px; z-index: 9999;
    display: flex; align-items: center; gap: 9px;
    height: 30px; padding: 0 13px; border-radius: 999px;
    background: rgba(16, 17, 19, .84);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: rgba(255, 255, 255, .85); font-size: 11.5px; letter-spacing: .04em; line-height: 1;
    max-width: min(72vw, 560px); overflow: hidden; white-space: nowrap; cursor: default;
    transition: max-width .45s cubic-bezier(.4, 0, .2, 1), padding .45s cubic-bezier(.4, 0, .2, 1);
  }
  .jess-chip .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: #e5a94d; }
  .jess-chip .label { flex: none; font-weight: 600; }
  .jess-chip code {
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 10.5px; color: rgba(255, 255, 255, .45);
  }
  .jess-chip a {
    flex: none; color: rgba(255, 255, 255, .78); text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, .3); padding-bottom: 1px; margin-left: 3px; cursor: pointer;
  }
  .jess-chip a:hover { color: #fff; }
  .jess-chip .label, .jess-chip code, .jess-chip a { transition: opacity .25s ease .2s; }
  .jess-chip.collapsed { max-width: 30px; padding: 0 12px; }
  .jess-chip.collapsed .label, .jess-chip.collapsed code, .jess-chip.collapsed a { opacity: 0; transition: opacity .12s ease; }
  .jess-chip.collapsed:hover { max-width: min(72vw, 560px); padding: 0 13px; }
  .jess-chip.collapsed:hover .label, .jess-chip.collapsed:hover code, .jess-chip.collapsed:hover a { opacity: 1; transition: opacity .25s ease .2s; }
</style>
</head>
<body>
<div class="jess-chip" id="chip" role="status">
  <span class="dot"></span>
  <span class="label">デモ表示中</span>
  <code>user:repeat · purchase:completed · cart:with_items</code>
  <a id="exit">元に戻る</a>
</div>
<main class="shop">
  <div class="shop-head">
    <h1>Sparrow Store</h1>
    <span class="user">こんにちは、佐藤 花子 さん（リピーター）</span>
  </div>
  <p class="shop-sub">デモDBの世界 — 右上のバナーは3秒後に点へ収納（ホバーで再展開）。「元に戻る」で進入前のページ・スクロール位置に復帰</p>
  <div class="grid">
    <div class="card"><div class="thumb"></div><h2>オーガニックコーヒー豆 200g</h2><p class="price">¥1,480</p><button>カートに入れる</button></div>
    <div class="card"><div class="thumb"></div><h2>セラミックドリッパー</h2><p class="price">¥2,860</p><button>カートに入れる</button></div>
    <div class="card"><div class="thumb"></div><h2>ハンドグラインダー</h2><p class="price">¥6,930</p><button>カートに入れる</button></div>
  </div>
  <div class="cartbar"><span>カート: 2点（¥4,340）</span><span>購入履歴: 3件</span></div>
</main>
<script>
  setTimeout(function () { document.getElementById('chip').classList.add('collapsed'); }, 3000);

  // ── 本実装の「元に戻る」の等価品。実物は GET /jess/exit を経由して
  //    cookie を消してから復帰する（このモックは復帰部分だけを再現） ──
  document.getElementById('exit').addEventListener('click', function () {
    var origin = sessionStorage.getItem('jess_origin');
    if (origin !== null) {
      var o = JSON.parse(origin);
      sessionStorage.setItem('jess_restore', String(o.y));
      location.href = o.url.split('/').pop() || 'journey-origin.html';
    } else {
      location.href = 'journey-origin.html'; // 記録なし → jess.exit_redirect 相当
    }
  });
</script>
</body>
</html>
