<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>案C 気配 — コーナーチップ（自動収納）</title>
<link rel="stylesheet" href="_mock.css">
<style>
  .jess-chip {
    position: fixed; top: 14px; right: 14px; z-index: 9999;
    display: flex; align-items: center; gap: 9px;
    height: 30px; padding: 0 13px; border-radius: 999px;
    background: rgba(16, 17, 19, .84);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    color: rgba(255, 255, 255, .85); font-size: 11.5px; letter-spacing: .04em;
    max-width: 420px; overflow: hidden; white-space: nowrap; cursor: default;
    transition: max-width .45s cubic-bezier(.4, 0, .2, 1), padding .45s cubic-bezier(.4, 0, .2, 1);
  }
  .jess-chip .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: #e5a94d; }
  .jess-chip .label { font-weight: 600; }
  .jess-chip code { font-family: "SF Mono", ui-monospace, monospace; font-size: 10.5px; color: rgba(255, 255, 255, .45); }
  .jess-chip a {
    color: rgba(255, 255, 255, .78); text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, .3); padding-bottom: 1px; margin-left: 3px;
  }
  .jess-chip a:hover { color: #fff; }
  .jess-chip.collapsed { max-width: 30px; padding: 0 12px; }
  .jess-chip.collapsed:hover { max-width: 420px; padding: 0 13px; }
</style>
</head>
<body>
<div class="jess-chip" id="chip" role="status">
  <span class="dot"></span>
  <span class="label">デモ表示中</span>
  <code>user:repeat · cart:with_items</code>
  <a href="#">元に戻る</a>
</div>
<main class="shop">
  <div class="shop-head">
    <h1>Sparrow Store</h1>
    <span class="user">こんにちは、佐藤 花子 さん（リピーター）</span>
  </div>
  <p class="shop-sub">ホストアプリのモック画面 — 表示3秒後に点だけに収納 → ホバーで再展開</p>
  <div class="grid">
    <div class="card"><div class="thumb"></div><h2>オーガニックコーヒー豆 200g</h2><p class="price">¥1,480</p><button>カートに入れる</button></div>
    <div class="card"><div class="thumb"></div><h2>セラミックドリッパー</h2><p class="price">¥2,860</p><button>カートに入れる</button></div>
    <div class="card"><div class="thumb"></div><h2>ハンドグラインダー</h2><p class="price">¥6,930</p><button>カートに入れる</button></div>
  </div>
  <div class="cartbar"><span>カート: 2点（¥4,340）</span><span>購入履歴: 3件</span></div>
</main>
<script>
  setTimeout(function () { document.getElementById('chip').classList.add('collapsed'); }, 3000);
</script>
</body>
</html>
